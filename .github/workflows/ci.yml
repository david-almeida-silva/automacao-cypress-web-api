name: Execução de Testes Cypress E2E e API

# Define quando a esteira vai rodar (ao fazer push para a branch main)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest # A máquina virtual usará Linux

    steps:
      - name: 📥 Baixar o código do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar o Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Versão que estamos usando no projeto

      - name: 📦 Instalar Dependências (npm install)
        run: npm install

      - name: 🧪 Executar Testes em Modo Headless
        run: npx cypress run

      - name: 📊 Salvar Relatório Mochawesome (Artifact)
        uses: actions/upload-artifact@v4
        if: always() # Garante que o relatório seja salvo mesmo se um teste falhar
        with:
          name: Relatorio-Cypress-Mochawesome
          path: cypress/reports/html/
          retention-days: 30