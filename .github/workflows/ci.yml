name: Execução de Testes Cypress E2E e API

# Define quando a esteira vai rodar
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest # A máquina virtual usará Linux

    steps:
      - name: 📥 Baixar o código do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar o Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar Dependências
        run: npm install

      - name: 🧪 Executar Testes em Modo Headless
        run: npx cypress run

      - name: 🔨 Forçar geração do Relatório HTML (Merge)
        if: always() # Roda mesmo se os testes falharem
        run: |
          npx mochawesome-merge "cypress/reports/html/.jsons/*.json" > cypress/reports/html/mochawesome-bundle.json
          npx marge cypress/reports/html/mochawesome-bundle.json -f index -o cypress/reports/html/ --inline

      - name: 📊 Salvar Relatório Mochawesome (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Relatorio-Cypress-Mochawesome
          path: cypress/reports/
          include-hidden-files: true # 👈 A MÁGICA: Obriga o GitHub a ler a pasta oculta .jsons
          retention-days: 30